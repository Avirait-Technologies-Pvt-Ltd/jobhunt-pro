# ================================
# JobHunt Pro - Docker Compose
# ================================

version: '3.8'

services:
  # --------------------------------
  # Application Service
  # --------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobhunt-pro
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - jobhunt-network

  # --------------------------------
  # Development Service
  # --------------------------------
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: jobhunt-pro-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    networks:
      - jobhunt-network
    profiles:
      - dev

  # --------------------------------
  # Nginx Reverse Proxy (Optional)
  # --------------------------------
  nginx:
    image: nginx:alpine
    container_name: jobhunt-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - jobhunt-network
    profiles:
      - production

networks:
  jobhunt-network:
    driver: bridge
