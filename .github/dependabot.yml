# ================================
# Dependabot Configuration
# ================================

version: 2
updates:
  # --------------------------------
  # NPM Dependencies
  # --------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "team-leads"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Group all minor and patch updates
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Group React ecosystem updates
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Group Next.js updates
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      # Group testing dependencies
      testing:
        patterns:
          - "jest"
          - "@testing-library/*"
          - "@types/jest"
      # Group TypeScript dependencies
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      # Group Tailwind dependencies
      tailwind:
        patterns:
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # --------------------------------
  # GitHub Actions
  # --------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"

  # --------------------------------
  # Docker Dependencies
  # --------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
      include: "scope"
